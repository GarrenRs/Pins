<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary metadata -->
    <title>Pinterest Video Downloader - Download Pinterest Videos Free | Pindrop</title>
    <meta name="description" content="Download Pinterest videos in MP4 format — no login, no app, no detours. Paste a Pinterest link and save the video directly to your device with Pindrop." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pindrop.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pindrop.app/" />
    <meta property="og:site_name" content="Pindrop" />
    <meta property="og:title" content="Pinterest Video Downloader - Download Pinterest Videos Free | Pindrop" />
    <meta property="og:description" content="Download Pinterest videos in MP4 format — no login, no app, no detours. Paste a Pinterest link and save the video directly to your device with Pindrop." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinterest Video Downloader - Download Pinterest Videos Free | Pindrop" />
    <meta name="twitter:description" content="Download Pinterest videos in MP4 format — no login, no app, no detours. Paste a Pinterest link and save the video directly to your device with Pindrop." />

    <!-- Theme -->
    <meta name="theme-color" content="#B92649" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD: WebSite structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pindrop",
      "url": "https://pindrop.app",
      "description": "Pindrop is a free Pinterest video downloader. Paste a public Pinterest video link and download the MP4 directly to your device — no account or app required.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pindrop.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
